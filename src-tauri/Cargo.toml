[package]
name = "macwin"
version = "0.2.0"
description = "MacWin Alpha 0.2 — Windows habits to Mac"
authors = ["MacWin"]
edition = "2021"
rust-version = "1.97"

[lib]
name = "macwin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
crc32fast = "1.5.0"
flate2 = "1.1.9"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.177"
