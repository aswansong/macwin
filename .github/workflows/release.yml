name: signed v1 release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v1 tag to release"
        required: true
        type: string
  push:
    tags: ["v1.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACWIN_UPDATER_PUBKEY: ${{ secrets.MACWIN_UPDATER_PUBKEY }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Align application version with release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-release.py "$RELEASE_TAG"

      - name: Require release signing material
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$MACWIN_UPDATER_PUBKEY"
          if [ "${{ matrix.os }}" = "macos-15" ]; then
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          else
            test -n "$WINDOWS_CERTIFICATE_BASE64"
            test -n "$WINDOWS_CERTIFICATE_PASSWORD"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Inject release updater public key
        shell: bash
        run: |
          test "$MACWIN_UPDATER_PUBKEY" != "PENDING_RELEASE_KEY"
          python3 - <<'PY'
          import json, os
          path = "src-tauri/tauri.conf.json"
          with open(path, encoding="utf-8") as fh:
              config = json.load(fh)
          config["plugins"]["updater"]["pubkey"] = os.environ["MACWIN_UPDATER_PUBKEY"]
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(config, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY

      - name: Build and test
        run: |
          npm test
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build signed installer
        if: matrix.os == 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Import Apple signing certificate
        if: matrix.os == 'macos-15'
        shell: bash
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE || secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_VALUE: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_B64"
          test -n "$APPLE_CERTIFICATE_PASSWORD_VALUE"
          KEYCHAIN_PATH="$RUNNER_TEMP/macwin-signing.keychain-db"
          KEYCHAIN_PASSWORD="macwin-$RANDOM-$RANDOM"
          CERTIFICATE_PATH="$RUNNER_TEMP/macwin-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_B64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD_VALUE" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build signed macOS app and updater artifact
        if: matrix.os == 'macos-15'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app

      - name: Create plain macOS DMG from signed app
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$bundle_root/macos/MacWin.app"
          dmg_path="$bundle_root/dmg/MacWin_${{ github.ref_name }}_${{ matrix.target }}.dmg"
          test -d "$app_path"
          mkdir -p "$bundle_root/dmg"
          hdiutil create -volname MacWin -srcfolder "$app_path" -ov -format UDZO "$dmg_path"

      - name: Verify and notarize macOS bundles
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/MacWin.app"
          dmg="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/MacWin_${{ github.ref_name }}_${{ matrix.target }}.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Sign Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "macwin-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -File -Include *.exe,*.msi | ForEach-Object {
            & signtool sign /fd SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & signtool verify /pa $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create checksums and dependency manifests
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f -maxdepth 4 -print0 | xargs -0 -I{} cp "{}" release-assets/ || true
          shasum -a 256 release-assets/* > release-assets/SHA256SUMS.txt
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > release-assets/sbom-cargo.json
          npm ls --json --omit=dev > release-assets/sbom-npm.json

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macwin-v1-${{ matrix.target }}
          path: release-assets
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Build signed updater manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/build-release-manifest.py "$RELEASE_TAG" release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/**
