name: v1 validation

on:
  push:
    branches: ["integration/v1.0.1-final-convergence", "release/v1.0.1", "main", "windows/v1.0.1-native-validation"]
  pull_request:
    branches: ["integration/v1.0.1-final-convergence", "release/v1.0.1", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt

      - name: Assert Apple Silicon runner
        if: matrix.os == 'macos-15'
        run: test "$(uname -m)" = "arm64"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Validate schemas and governance
        run: ./scripts/validate-m1
        shell: bash

      - name: Build Tauri binary without bundling
        run: npm run tauri build -- --no-bundle

      - name: Upload validation binary
        uses: actions/upload-artifact@v6
        with:
          name: macwin-v1-validation-${{ runner.os }}
          path: |
            src-tauri/target/release/macwin
            src-tauri/target/release/macwin.exe
          if-no-files-found: error

      - name: Smoke test published Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          RELEASE_URL: https://github.com/aswansong/macwin/releases/download/v1.0.1/MacWin_1.0.1_x64-setup.exe
          CHECKSUMS_URL: https://github.com/aswansong/macwin/releases/download/v1.0.1/SHA256SUMS.txt
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'macwin-v1.0.1-installer-smoke'
          New-Item -ItemType Directory -Force $root | Out-Null
          $installer = Join-Path $root 'MacWin_1.0.1_x64-setup.exe'
          $checksums = Join-Path $root 'SHA256SUMS.txt'
          Invoke-WebRequest -Uri $env:RELEASE_URL -OutFile $installer
          Invoke-WebRequest -Uri $env:CHECKSUMS_URL -OutFile $checksums
          $line = Get-Content $checksums | Where-Object { $_ -match 'MacWin_1\.0\.1_x64-setup\.exe$' }
          if (-not $line) { throw 'Release checksum entry for the Windows installer is missing' }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Release installer hash mismatch: $actual != $expected" }

          $installRoot = Join-Path $root 'installed'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install failed with exit code $($install.ExitCode)" }
          $app = Get-ChildItem -Path $installRoot -Filter 'macwin.exe' -File -Recurse | Select-Object -First 1
          $uninstaller = Get-ChildItem -Path $installRoot -Filter 'uninstall.exe' -File -Recurse | Select-Object -First 1
          if (-not $app -or -not $uninstaller) { throw 'Installed app or uninstaller was not found' }
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) { throw 'Installed MacWin process exited before the launch smoke check' }
          Stop-Process -Id $process.Id -Force
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed with exit code $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 1
          if (Test-Path $app.FullName) { throw 'Installed app remained after uninstall' }
          Write-Output "WINDOWS_INSTALL_LAUNCH_UNINSTALL_SMOKE: PASS hash=$actual"
